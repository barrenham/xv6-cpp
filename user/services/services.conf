# Services are independent user ELF programs. Core FS/driver startup is listed
# automatically by fsboot. Add application sections below, for example:
# [my-service]
# exec=/bin/my-service --foreground
# after=rootfs
# ready=exec
# restart=on-failure
# restart-limit=5
# restart-delay-ms=250
# log=/tmp/my-service.log
# log-max-bytes=65536
# log-backups=2
# enabled=yes
